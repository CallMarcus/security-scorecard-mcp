# GitHub Dependabot configuration for Security Scorecard MCP
# Automatically creates pull requests for dependency updates
# Documentation: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    # Supply-chain safety: let a newly published version "age" a few days before
    # Dependabot proposes it, so a compromised/malicious release has time to be
    # caught and yanked before it can auto-PR into the repo. Applies to all deps
    # (no `include` = everything). https://docs.github.com/en/code-security/dependabot
    cooldown:
      default-days: 3       # minor + major updates wait 3 days
      semver-patch-days: 2  # lower-risk patches wait 2 days
    open-pull-requests-limit: 5
    reviewers:
      - "CallMarcus"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    # Group minor and patch updates to reduce PR noise
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Allow both dependencies and devDependencies updates
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
