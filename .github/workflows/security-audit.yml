# Security audit workflow for Security Scorecard MCP
# Runs npm audit and dependency checks on all PRs and main branch

name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security audit every Monday at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run npm audit
      run: npm audit --audit-level=moderate
      
    - name: Run npm audit fix (dry run)
      run: npm audit fix --dry-run
      
    - name: Check for known vulnerabilities
      run: |
        echo "Checking for high severity vulnerabilities..."
        if npm audit --audit-level=high --json | jq -e '.metadata.vulnerabilities.high > 0' > /dev/null 2>&1; then
          echo "❌ High severity vulnerabilities found!"
          npm audit --audit-level=high
          exit 1
        else
          echo "✅ No high severity vulnerabilities found"
        fi
        
    - name: Validate package-lock.json
      run: |
        if [ -f package-lock.json ]; then
          echo "✅ package-lock.json exists"
          npm ci --dry-run
        else
          echo "❌ package-lock.json missing"
          exit 1
        fi