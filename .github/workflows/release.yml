# Tag-driven release: push a vX.Y.Z tag and this publishes to npm + the MCP
# registry and cuts the matching GitHub Release, all from one source of truth
# (the tag). Keeps the three venues from drifting apart.
#
# Auth is keyless (OIDC) — no npm or registry tokens stored in the repo:
#   - npm:          OIDC "trusted publishing" (configured once on npmjs.com)
#   - MCP registry: `mcp-publisher login github-oidc`
#
# ONE-TIME SETUP (required before the first run, or npm publish will fail auth):
#   npmjs.com -> @callmarcus/securityscorecard-mcp -> Settings -> Trusted Publisher
#   Provider: GitHub Actions
#   Repository: CallMarcus/security-scorecard-mcp
#   Workflow filename: release.yml
#
# RELEASE FLOW: land a version bump (package.json + src/index.ts + server.json)
# via PR to main, then:
#   git checkout main && git pull
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# RE-RUNNING: every publish step is idempotent (skips what already exists), so
# a partial failure can be finished with a manual dispatch for the same tag:
#   gh workflow run release.yml -f tag=vX.Y.Z
# The v2.0.0 release needed this: npm publish succeeded but the registry step
# ran one second later, before npm served the new version, and 404'd.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v2.0.0"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for both npm trusted publishing and the MCP registry
      contents: write   # create the GitHub Release
    env:
      # The tag being released: from the push for tag pushes, from the input
      # for manual re-runs.
      TAG_NAME: ${{ inputs.tag || github.ref_name }}
      PACKAGE: "@callmarcus/securityscorecard-mcp"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # npm OIDC trusted publishing requires npm CLI >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Guard against the drift we hit once: the pushed tag must match the
      # version baked into package.json AND server.json, so a stale/mis-tagged
      # commit can never ship.
      - name: Verify tag matches package versions
        run: |
          TAG="${TAG_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          SRV="$(node -p "require('./server.json').version")"
          echo "tag=$TAG  package.json=$PKG  server.json=$SRV"
          if [ "$TAG" != "$PKG" ]; then echo "::error::tag v$TAG does not match package.json $PKG"; exit 1; fi
          if [ "$TAG" != "$SRV" ]; then echo "::error::tag v$TAG does not match server.json $SRV"; exit 1; fi

      - name: Build
        run: npm run build:fast

      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN: OIDC trusted publishing authenticates via id-token.
      # npm auto-attaches build provenance for public repo + public package.
      # Skipped when the version is already on npm so a re-run can get past it.
      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PACKAGE@$VERSION is already on npm, skipping publish"
          else
            npm publish --access public
          fi

      # The MCP registry validates that the npm version exists before it accepts
      # the entry. A fresh publish can take a little while to be served, so poll
      # rather than racing it.
      - name: Wait for npm to serve the version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
              echo "$PACKAGE@$VERSION visible on npm (attempt $attempt)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$PACKAGE@$VERSION not served by npm after 5 minutes"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $TAG_NAME already exists, skipping"
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes --latest
          fi
